<body class="bg-background text-on-surface font-body-md selection:bg-primary-container selection:text-white">
<!-- Top Bar (Brand Only for focus) -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-gutter py-sm scrim-bottom">
<div class="font-display-xl text-headline-lg tracking-tighter text-primary-container">FLIX</div>
</header>
<!-- Main Hero Background -->
<main class="relative min-h-screen w-full flex items-center justify-center overflow-hidden">
<div class="absolute inset-0 z-0">
<img class="w-full h-full object-cover" data-alt="A cinematic wide shot of an empty, high-end private theater with deep velvet seats and a glowing silver screen. The lighting is low-key and dramatic, with soft blue and purple atmospheric haze filling the room. The mood is sophisticated, premium, and authoritative, perfectly aligning with a dark-mode entertainment interface. Vibrant red accents from hidden floor lights punctuate the deep black shadows." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAdtMGjAPgih2O1DRBetSkXAAB4pD46CBofcNh-pvSdi5b1ajT6oL7-8P5nXc7kpDz6WYgvff366tdxojuzbQceGXlHzPeXs_VDAeRABEGF1KbYi0xxuCoAlp1yxw0XoVYjQssfcz-Whphfe8F2MHEEBvRTu5WsPBInPHVALEVlWCQq-0ZazZsDdSevFZaLKc98dcGiSsrQ7kxPT5tLqXKFHO_o33sgCElKhwt7DSxUGUff4E0L_IbXO3VoCWO3t_Yz1QTmdmq12wM"/>
<div class="absolute inset-0 cinematic-overlay"></div>
</div>
<!-- Signup Form Container -->
<section class="relative z-10 w-full max-w-[450px] mx-gutter">
<div class="bg-black/60 backdrop-blur-xl p-lg rounded-xl shadow-2xl border border-white/10">
<div class="mb-lg">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-xs">Sign Up</h1>
<p class="font-body-md text-body-md text-on-surface-variant">New to FLIX? Sign up now</p>
</div>
<form class="space-y-md" onsubmit="event.preventDefault(); window.location.href='index.html';">
<!-- Name Field -->
<div class="group">
<label class="block font-label-bold text-label-bold text-on-surface-variant mb-xs group-focus-within:text-primary-container transition-colors" for="name">Full Name</label>
<input class="w-full bg-surface-container border-none border-b-2 border-transparent focus:border-primary-container focus:ring-0 text-on-surface rounded-lg py-sm px-base transition-all duration-300 placeholder:text-on-surface-variant/40" id="name" name="name" placeholder="Enter your name" type="text"/>
</div>
<!-- Email Field -->
<div class="group">
<label class="block font-label-bold text-label-bold text-on-surface-variant mb-xs group-focus-within:text-primary-container transition-colors" for="email">Email Address</label>
<input class="w-full bg-surface-container border-none border-b-2 border-transparent focus:border-primary-container focus:ring-0 text-on-surface rounded-lg py-sm px-base transition-all duration-300 placeholder:text-on-surface-variant/40" id="email" name="email" placeholder="email@example.com" type="email"/>
</div>
<!-- Password Field -->
<div class="group">
<label class="block font-label-bold text-label-bold text-on-surface-variant mb-xs group-focus-within:text-primary-container transition-colors" for="password">Password</label>
<input class="w-full bg-surface-container border-none border-b-2 border-transparent focus:border-primary-container focus:ring-0 text-on-surface rounded-lg py-sm px-base transition-all duration-300 placeholder:text-on-surface-variant/40" id="password" name="password" placeholder="Min. 8 characters" type="password"/>
</div>
<!-- Primary Action -->
<div class="pt-base">
<button class="w-full bg-primary-container hover:bg-primary-container/90 active:scale-[0.98] transition-all py-md rounded-lg text-white font-label-bold text-body-lg shadow-lg shadow-primary-container/20" type="submit">
                            Get Started
                        </button>
</div>
<!-- Additional Context -->
<div class="flex items-center space-x-base mt-sm">
<input class="rounded-sm bg-surface-container border-outline text-primary-container focus:ring-primary-container" id="terms" type="checkbox"/>
<label class="font-label-sm text-label-sm text-on-surface-variant" for="terms">
                            I agree to the <a class="text-on-surface hover:underline" href="login.html">Terms of Service</a> and <a class="text-on-surface hover:underline" href="#">Privacy Policy</a>
</label>
</div>
</form>
<!-- Redirect to Login -->
<div class="mt-lg pt-md border-t border-white/5 flex flex-col items-center gap-sm">
<span class="font-body-md text-on-surface-variant">Already have an account?</span>
<a class="font-label-bold text-primary-container hover:text-primary-container/80 transition-colors uppercase tracking-widest text-label-sm" href="login.html">
                        Sign In
                    </a>
</div>
</div>
</section>
</main>
<!-- Suppressed Nav Shells per Rules for Transactional Screens -->
<!-- (BottomNavBar and NavigationDrawer are not rendered here to focus on user conversion) -->
<footer class="absolute bottom-base w-full text-center px-gutter">
<p class="font-label-sm text-label-sm text-on-surface-variant/40">
            © 2024 FLIX Entertainment. All rights reserved.
        </p>
</footer>
