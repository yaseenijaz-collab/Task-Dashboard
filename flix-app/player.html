<body class="font-body-md text-on-surface select-none">
<!-- Cinematic Background -->
<div class="fixed inset-0 z-0">
<img alt="Cinematic still from The Last Frontier" class="w-full h-full object-cover" data-alt="A wide cinematic landscape of a futuristic sci-fi city at night during a heavy rainstorm. Glowing neon signs in vibrant reds and teals reflect off the wet, dark asphalt streets. Massive brutalist skyscrapers loom in the background under a moody, dark cloudy sky. The overall atmosphere is high-contrast, immersive, and premium, utilizing deep blacks and sharp neon highlights to create a dramatic sense of depth." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBvtAycao-raBW7cGS1UcSgWxXyRDi3Klyr2FZrUCN2b7fzM2SXkDHMXvqruawp79EKBasng8WqdPyrtk2rnUp3XUwU6OrPo_V0Mupw74hvjoVL9_g32IQHa_iNk8wXNgJwYwCFftMVUq-kQYpITxjgVOlXsk91rQ3_dZ5htdsOkTTv9abgIBHC8yriqVJmbimUxu1bP1AttDVIiWAAsCLIiPbBtltdRMimYfhy69OgAK_uBzx3rsINcE0rCP4rAacFLjlySZx5LOE"/>
<!-- Dynamic Scrims for readability -->
<div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-black/60"></div>
</div>
<!-- UI Overlay Layer -->
<main class="relative z-10 w-full h-screen flex flex-col justify-between p-lg md:p-xl">
<!-- Top Bar: Back & Utility -->
<header class="flex justify-between items-center">
<button class="flex items-center gap-base group cursor-pointer hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined text-[32px]">arrow_back</span>
<span class="font-label-bold text-headline-md tracking-tight">Back</span>
</button>
<div class="flex gap-md">
<button class="hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[28px]">help</span>
</button>
</div>
</header>
<!-- Center Controls: Playback -->
<section class="flex-grow flex items-center justify-center">
<div class="flex items-center gap-xl md:gap-[120px]">
<button class="flex items-center justify-center group active:scale-90 transition-transform">
<span class="material-symbols-outlined text-[48px] md:text-[64px] group-hover:text-primary">replay_10</span>
</button>
<button class="w-20 h-20 md:w-32 md:h-32 rounded-full bg-white/10 backdrop-blur-md border border-white/20 flex items-center justify-center group active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[56px] md:text-[80px] fill-icon text-white">play_arrow</span>
</button>
<button class="flex items-center justify-center group active:scale-90 transition-transform">
<span class="material-symbols-outlined text-[48px] md:text-[64px] group-hover:text-primary">forward_10</span>
</button>
</div>
</section>
<!-- Bottom Controls: Progress & Metadata -->
<footer class="w-full space-y-md">
<!-- Progress Bar Section -->
<div class="space-y-sm">
<div class="relative w-full h-1.5 bg-white/20 rounded-full cursor-pointer group">
<div class="absolute top-0 left-0 h-full w-[42%] bg-primary-container rounded-full shadow-[0_0_12px_rgba(229,9,20,0.6)]"></div>
<div class="absolute top-1/2 left-[42%] -translate-y-1/2 w-4 h-4 bg-primary-container rounded-full scale-0 group-hover:scale-100 transition-transform"></div>
</div>
<div class="flex justify-between items-center text-secondary font-label-bold">
<span class="text-label-bold">42:15</span>
<span class="text-label-bold">2:14:00</span>
</div>
</div>
<!-- Bottom Action Row -->
<div class="flex flex-col md:flex-row justify-between items-end md:items-center gap-md">
<div class="flex flex-col">
<h1 class="font-display-xl text-headline-lg tracking-tighter text-white uppercase opacity-90">The Last Frontier</h1>
<span class="font-label-bold text-primary-container text-label-sm tracking-widest uppercase">S1 : E4 "The Neon Divide"</span>
</div>
<div class="flex items-center gap-lg md:gap-xl">
<button class="flex items-center gap-xs hover:text-primary transition-colors">
<span class="material-symbols-outlined">volume_up</span>
</button>
<button class="flex items-center gap-xs hover:text-primary transition-colors">
<span class="material-symbols-outlined">subtitles</span>
<span class="font-label-bold hidden md:inline">Audio &amp; Subtitles</span>
</button>
<button class="flex items-center gap-xs hover:text-primary transition-colors">
<span class="material-symbols-outlined">video_library</span>
<span class="font-label-bold hidden md:inline">Episodes</span>
</button>
<button class="flex items-center gap-xs hover:text-primary transition-colors">
<span class="material-symbols-outlined">speed</span>
<span class="font-label-bold hidden md:inline">1.0x</span>
</button>
<button class="flex items-center gap-xs hover:text-primary transition-colors">
<span class="material-symbols-outlined">fullscreen</span>
</button>
</div>
</div>
</footer>
</main>
<!-- Navigation Drawer (Predicted Shared Component for context) -->
<!-- Initially Hidden, part of the system's architecture -->
<div class="hidden fixed inset-y-0 left-0 z-[60] flex flex-col bg-surface-container h-full w-64 rounded-r-xl shadow-xl transition-transform -translate-x-full" id="drawer">
<div class="p-md flex items-center gap-base border-b border-surface-variant">
<div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center">
<span class="material-symbols-outlined text-white">person</span>
</div>
<div>
<p class="font-label-bold text-on-surface">Cinematic Explorer</p>
<p class="text-label-sm text-secondary">Premium Member</p>
</div>
</div>
<nav class="flex-grow py-md">

<span class="material-symbols-outlined">add</span>

</a>

<span class="material-symbols-outlined">notifications</span>

</a>
<a class="flex items-center px-md py-sm text-on-surface-variant hover:bg-surface-variant transition-colors gap-md" href="#">
<span class="material-symbols-outlined">settings</span>
<span class="font-body-md">Settings</span>
</a>
</nav>
<div class="p-md border-t border-surface-variant">
<a class="flex items-center gap-md text-on-surface-variant hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined">logout</span>
<span class="font-body-md">Sign Out</span>
</a>
</div>
</div>
