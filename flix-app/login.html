<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .scrim-overlay {
            background: linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.95) 100%);
        }
        .vignette {
            background: radial-gradient(circle, transparent 20%, black 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body-md text-on-surface antialiased overflow-hidden">
<!-- Background Texture -->
<div class="fixed inset-0 z-0">
<div class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1485846234645-a62644f84728?auto=format&amp;fit=crop&amp;q=80&amp;w=2059')] bg-cover bg-center grayscale opacity-20" data-alt="A dark, cinematic collage of blurred movie posters and film strips, creating a textured background for a premium entertainment app. The lighting is low-key with deep shadows and high contrast, maintaining a professional and immersive dark mode aesthetic. The composition uses a dark charcoal and pure black palette to emphasize depth and atmosphere."></div>
<div class="absolute inset-0 vignette"></div>
<div class="absolute inset-0 scrim-overlay"></div>
</div>
<!-- Login Container -->
<main class="relative z-10 flex flex-col items-center justify-between min-h-screen px-gutter py-xl">
<!-- Header / Logo -->
<header class="w-full flex justify-center pt-lg">
<h1 class="font-display-xl text-headline-lg tracking-tighter text-primary-container">FLIX</h1>
</header>
<!-- Form Section -->
<section class="w-full max-w-[400px] flex flex-col gap-md">
<div class="flex flex-col gap-xs mb-base">
<h2 class="font-headline-md text-headline-md text-on-surface">Sign In</h2>
</div>
<form class="flex flex-col gap-md" onsubmit="event.preventDefault(); window.location.href='index.html';">
<!-- Input Group 1 -->
<div class="relative">
<input class="peer block w-full px-md pt-lg pb-base bg-surface-container border-0 border-b-2 border-transparent focus:border-primary-container focus:ring-0 text-on-surface rounded-lg transition-all placeholder-transparent" id="identity" placeholder=" " type="text"/>
<label class="absolute left-md top-base text-on-surface-variant font-label-sm transition-all peer-placeholder-shown:top-md peer-placeholder-shown:text-body-md peer-focus:top-base peer-focus:text-label-sm peer-focus:text-primary-container" for="identity">
                        Email or phone number
                    </label>
</div>
<!-- Input Group 2 -->
<div class="relative">
<input class="peer block w-full px-md pt-lg pb-base bg-surface-container border-0 border-b-2 border-transparent focus:border-primary-container focus:ring-0 text-on-surface rounded-lg transition-all placeholder-transparent" id="password" placeholder=" " type="password"/>
<label class="absolute left-md top-base text-on-surface-variant font-label-sm transition-all peer-placeholder-shown:top-md peer-placeholder-shown:text-body-md peer-focus:top-base peer-focus:text-label-sm peer-focus:text-primary-container" for="password">
                        Password
                    </label>
</div>
<!-- Primary CTA -->
<button class="w-full bg-primary-container text-on-primary-container font-label-bold py-md rounded-lg shadow-xl active:scale-95 transition-transform duration-200 uppercase tracking-wider" type="submit">
                    Sign In
                </button>
<div class="flex flex-col items-center gap-base mt-sm">
<a class="text-on-surface-variant font-label-sm hover:text-on-surface transition-colors" href="#">
                        Forgot password?
                    </a>
</div>
</form>
</section>
<!-- Footer Section -->
<footer class="w-full flex flex-col items-center gap-base pb-lg">
<div class="flex items-center gap-xs">
<span class="text-on-surface-variant font-body-md">New to FLIX?</span>
<a class="text-on-surface font-label-bold hover:underline transition-all" href="#">Sign up now.</a>
</div>
<div class="mt-md px-xl text-center">
<p class="text-[10px] text-on-surface-variant/40 leading-relaxed max-w-[280px]">
                    This page is protected by Google reCAPTCHA to ensure you're not a bot.
                    <span class="text-primary/40">Learn more.</span>
</p>
</div>
</footer>
</main>
<!-- Hidden Material Symbol usage as required by shared component logic in invisible context if needed -->
<div class="hidden">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
<span class="material-symbols-outlined" data-icon="search">search</span>
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="material-symbols-outlined" data-icon="video_library">video_library</span>
<span class="material-symbols-outlined" data-icon="download">download</span>
<span class="material-symbols-outlined" data-icon="person">person</span>
</div>
<script src="js/navigation.js"></script></body></html>
